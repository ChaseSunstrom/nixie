<!doctype html><meta charset="utf-8"><title>nixie</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 480px at 50% -200px,color-mix(in srgb,@brand@ 22%,transparent),transparent 70%),@bg@;color:@ink@;font:14px Archivo,sans-serif}
form{width:360px;background:@s1@;border:1px solid @line@;border-radius:14px;padding:28px;display:grid;gap:12px;box-shadow:0 24px 60px -24px @shadow@;animation:pop .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){form{animation:none}}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.03em}h1{margin:6px 0 0;font-size:22px;font-weight:500}p{margin:0;color:@muted@}
label{display:grid;gap:4px;font-weight:500}input{background:@s2@;border:1px solid @line@;border-radius:6px;color:@ink@;height:36px;padding:0 10px;font:inherit}input:focus{outline:2px solid @brand2@;outline-offset:1px}
button{margin-top:4px;height:38px;background:@brand@;border:0;border-radius:6px;color:#fff;font:inherit;cursor:pointer}button:hover{filter:brightness(1.12)}
</style>
<form method="post" action="/unlock">
  <div class="brand"><svg width="28" height="28" viewBox="0 0 72 72" aria-hidden="true"><rect x="10" y="18" width="10" height="44" rx="3" fill="@brand@"/><rect x="10" y="18" width="52" height="10" rx="3" fill="@brand@"/><rect x="52" y="18" width="10" height="44" rx="3" fill="@brand2@"/></svg>nixie</div>
  <h1>Unlock the control panel</h1><p>The administrator's password, and the code from the authenticator app if one is enrolled.</p>
  <label>Password<input name="password" type="password" autofocus></label>
  <label>Second factor<input name="code" inputmode="numeric" placeholder="if enrolled"></label>
  <button>Unlock</button>
</form>

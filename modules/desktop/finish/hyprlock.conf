general {
  hide_cursor = true
  ignore_empty_input = true
}
background {
  path = @wallpaper@
  blur_passes = 3
  blur_size = 7
  brightness = @dim@
}
label {
  text = $TIME
  font_family = @uiFont@
  font_size = 96
  color = @rgb_ink@
  position = 0, 140
  halign = center
  valign = center
}
label {
  text = cmd[update:60000] date +'%A %-d %B'
  font_family = @uiFont@
  font_size = 20
  color = @rgb_muted@
  position = 0, 60
  halign = center
  valign = center
}
label {
  text = $USER
  font_family = @uiFont@
  font_size = 15
  color = @rgb_muted@
  position = 0, -46
  halign = center
  valign = center
}
input-field {
  size = 320, 48
  outline_thickness = 1
  outer_color = @rgb_line2@
  check_color = @rgb_brand@
  fail_color = @rgb_err@
  inner_color = @rgb_s1@
  font_color = @rgb_ink@
  font_family = @uiFont@
  placeholder_text = <span foreground="##@bare_muted@">password</span>
  fail_text = <span foreground="##@bare_err@">wrong</span>
  rounding = 12
  position = 0, -110
  halign = center
  valign = center
}
label {
  text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/$/% battery/'
  font_family = @monoFont@
  font_size = 12
  color = @rgb_muted@
  position = -24, 24
  halign = right
  valign = bottom
}
